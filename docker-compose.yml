services:
  # https-portal:
  #   image: steveltn/https-portal:1
  #   container_name: shirasagi_https-portal
  #   ports:
  #     - '80:80'
  #     - '443:443'
  #   environment:
  #     DOMAINS: >-
  #       your.domain -> http://nginx
  #     # STAGE: 'production' # Don't use production until staging works
  #     WORKER_PROCESSES: auto
  #     WORKER_CONNECTIONS: 2048
  #     CLIENT_MAX_BODY_SIZE: '128M'
  #   links:
  #     - nginx
  #   volumes:
  #     - ./certs:/var/lib/https-portal
  #   restart: always
  nginx:
    #image: owasp/modsecurity-crs:v3.3.2-nginx
    image: nginx:1.30.4
    container_name: shirasagi_nginx
    volumes:
      - ./nginx/conf.d/shirasagi.conf:/etc/nginx/conf.d/shirasagi.conf
      - /dev/null:/etc/nginx/conf.d/default.conf
      - ./nginx/log:/var/log/nginx
      - ./nginx/www:/var/www
    depends_on:
      - shirasagi
    ports:
      - 80:80
    restart: always
  shirasagi:
    build: ./shirasagi_image
    container_name: shirasagi_shirasagi
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}
    volumes:
      - ./shirasagi_image/run.sh:/run.sh
      - ./shirasagi:/var/www/shirasagi
      - bundle:/var/www/shirasagi/vendor/bundle
    command: bash /run.sh
    depends_on:
      mongodb:
        condition: service_healthy
    tty: true
    stdin_open: true
    restart: always
  mongodb:
    image: mongo:8.0.26
    container_name: shirasagi_db
    command: --wiredTigerCacheSizeGB=1
    volumes:
      - dbdata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always
volumes:
  bundle:
    driver: local
  dbdata:
    driver: local
